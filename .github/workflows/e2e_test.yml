name: E2E Testing

on:
  push:
    branches:
      - main
  pull_request:

env:
  POETRY_VERSION: "1.8.3"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Let the matrix finish to see if the failure was transient
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        test-package:
          [
            "basic_hitl",
            "basic_streaming",
            "deploy",
            "apiserver",
            "basic_session",
            "basic_workflow",
            "core",
            "message_queues",
          ]
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: ${{ env.POETRY_VERSION }}
      - name: Install deps
        shell: bash
        run: poetry install --with dev
      - name: Run All E2E Tests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          TOPIC_PREFIX: ${{ matrix.python-version }}
        run: poetry run pytest e2e_tests/${{ matrix.test-package }} -s
