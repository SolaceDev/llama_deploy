name: Docker image release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

env:
  DOCKER_REPO_NAME: llamaindex/llama-deploy

jobs:
  build-and-push:
    name: Build base image
    runs-on: ubuntu-latest
    # don't run from forks
    if: github.repository_owner == 'run-llama'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: $DOCKER_REPO_NAME

      - name: Build images
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5
        env:
          IMAGE_TAG_SUFFIX: ${{ steps.meta.outputs.version }}
          LLAMA_DEPLOY_VERSION: ${{ steps.meta.outputs.version }}
        with:
          workdir: docker
          targets: all
          push: true
